services:
  postgres:
    image: postgres:18
    container_name: visp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: visp
      POSTGRES_USER: visp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
